name: Veille de Ludy

# Demande d'Ahmed (15/11/2026, après une panne du service de données Supabase à 22 h 30 : « il faut veiller que tout fonctionne
# tout le temps »). Toutes les 30 min :
# 1. santé de Supabase (base, service de données, connexion) par l'API de gestion ; service de données ou base en panne à deux
#    contrôles espacés de 4 min = projet redémarré automatiquement (rien n'est effacé), puis attente du retour ;
# 2. dernier passage du collecteur (table logs, plus de 45 min = signalé) ;
# 3. site en ligne.
# Tout problème fait échouer la veille : GitHub envoie alors un e-mail (réglage « Actions » des notifications GitHub).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    name: Veille (Supabase, collecteur, site)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REF: cgiiwumbblimvmrypxlc
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Contrôles et réparation
        run: |
          set -u
          fail=""
          api() { curl -s -m 40 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$@"; }
          sick() { api "https://api.supabase.com/v1/projects/$REF/health?services=db,rest" \
            | python3 -c "import sys,json
          try: d=json.load(sys.stdin)
          except Exception: print('illisible'); sys.exit(0)
          print(' '.join(x['name'] for x in d if not x.get('healthy')) if isinstance(d, list) else 'illisible')"; }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN absent"; exit 1; fi
          s=$(sick); echo "Supabase en panne : ${s:-aucun service}"
          if [ -n "$s" ]; then
            sleep 240; s=$(sick); echo "Second contrôle : ${s:-aucun service}"
            if [ -n "$s" ]; then
              echo "::warning::Service(s) en panne depuis plus de 4 min ($s) : redémarrage du projet Supabase"
              api -X POST "https://api.supabase.com/v1/projects/$REF/restart" -o /dev/null -w "redémarrage demandé : HTTP %{http_code}\n"
              for i in $(seq 1 30); do sleep 30; s=$(sick); [ -z "$s" ] && break; done
              if [ -z "$s" ]; then fail="$fail Supabase était en panne : projet redémarré automatiquement, tout est revenu."
              else fail="$fail Supabase toujours en panne après redémarrage ($s)."; fi
            fi
          fi
          # dernier passage du collecteur
          if [ -n "$SUPABASE_SERVICE_KEY" ] && [ -z "$s" ]; then
            last=$(curl -s -m 30 "https://$REF.supabase.co/rest/v1/logs?select=at&order=at.desc&limit=1" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              | python3 -c "import sys,json,datetime
          try: d=json.load(sys.stdin); t=datetime.datetime.fromisoformat(d[0]['at'].replace('Z','+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60))
          except Exception: print(-1)")
            echo "Dernier passage du collecteur : il y a $last min"
            if [ "$last" -lt 0 ] || [ "$last" -gt 45 ]; then fail="$fail Collecteur : aucun passage depuis ${last} min (Apps Script à vérifier)."; fi
          fi
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" https://ludy-flotte.pages.dev/)
          echo "Site : HTTP $code"; [ "$code" = 200 ] || fail="$fail Site : HTTP $code."
          if [ -n "$fail" ]; then echo "::error::$fail"; exit 1; fi
          echo "Tout fonctionne."
