name: Tests et mise en ligne

on:
  # main (mise en ligne) et PR seulement : une branche avec une PR ouverte n'est plus testée deux fois (minutes GitHub Actions)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests (moteur v6, base, site)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PG_URL: postgresql://postgres:postgres@localhost:5432/flotte
      PGRST_DB_URI: postgresql://authenticator:authpass@localhost:5432/flotte
      POSTGREST_BIN: ${{ github.workspace }}/.bin/postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: PostgREST (même moteur que Supabase)
        run: |
          mkdir -p .bin
          curl -sSfL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C .bin
      - name: Base de test (migrations Supabase)
        run: bash tests/setup_db.sh
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            grep -E "^not ok|^  error:|^    [A-Za-z≠'«]" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Captures d'écran du site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-site
          path: tests/out/*.png
          retention-days: 14

  deploy:
    name: Mise en ligne
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CF_PROJECT: ludy-flotte
      SUPABASE_URL: https://cgiiwumbblimvmrypxlc.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # relance d'une ancienne exécution : rien n'est publié (sinon le site et le collecteur reviendraient à une version plus ancienne)
      - name: Dernière version de main ?
        id: head
        run: |
          git fetch -q origin main --depth=1
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::$GITHUB_SHA n'est plus la dernière version de main : rien n'est publié"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      # chaque partie est publiée même si une autre échoue (le travail reste en échec, avec la raison)
      # site : Cloudflare Pages (gratuit, publication directe des fichiers de site/, en-têtes de site/_headers) ;
      # Netlify abandonné le 16/10/2026 (crédit du compte épuisé : publications bloquées)
      - name: Site (Cloudflare Pages)
        if: ${{ !cancelled() && steps.head.outputs.ok == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : site non publié (voir README)"; exit 0; fi
          # projet créé au premier passage (ensuite il existe déjà : message ignoré)
          npx --yes wrangler@4.147.0 pages project create "$CF_PROJECT" --production-branch main || true
          # commit publié : une page restée ouverte voit qu'une nouvelle version existe (siteBuildCheck, app.js)
          git rev-parse HEAD > site/build.txt
          npx --yes wrangler@4.147.0 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --format=%s | head -c 200)"
      - name: Collecteur (installé automatiquement par Apps Script au passage suivant)
        if: ${{ !cancelled() && steps.head.outputs.ok == '1' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then echo "::warning::Secret SUPABASE_SERVICE_KEY absent : collecteur non publié (voir README)"; exit 0; fi
          node scripts/publish-collector.js
      - uses: supabase/setup-cli@v1
        if: ${{ !cancelled() && steps.head.outputs.ok == '1' }}
        with:
          version: 2.119.0
      - name: Relais Geotab en direct (fonction Supabase geotab-live)
        if: ${{ !cancelled() && steps.head.outputs.ok == '1' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Secret SUPABASE_ACCESS_TOKEN absent : relais en direct non publié (voir README)"; exit 0; fi
          supabase functions deploy geotab-live --project-ref cgiiwumbblimvmrypxlc --use-api
