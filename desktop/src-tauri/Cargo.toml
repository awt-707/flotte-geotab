[package]
name = "ludy"
version = "1.2.0"
description = "Ludy · Supervision de flotte"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["unstable"] }
tauri-plugin-opener = "2"
url = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
