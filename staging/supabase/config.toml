# Local only. Official Supabase CLI 2.122.0; independent Docker network/volumes.
project_id = "ludy-staging"

[api]
enabled = true
port = 57421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = true

[db]
port = 57422
shadow_port = 57420
major_version = 17
health_timeout = "3m"

[db.pooler]
enabled = false
port = 57429

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 57423
api_url = "http://127.0.0.1:57421"

[local_smtp]
enabled = true
port = 57424

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
