<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ludy · Réserver une course</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1a2330; --mut:#5d6b78; --acc:#7b1e2e; --ok:#147a3c; --line:#e3ddd1; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.4; }
  .wrap { max-width:460px; margin:0 auto; padding:16px; }
  header { text-align:center; padding:14px 0 6px; }
  header img { height:34px; }
  h1 { font-size:20px; margin:10px 0 2px; }
  .sub { color:var(--mut); font-size:14px; margin-bottom:14px; text-align:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 3px; }
  input, textarea { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, textarea:focus { outline:2px solid var(--acc); outline-offset:-1px; }
  .row2 { display:flex; gap:10px; } .row2 > div { flex:1; }
  .acbox { position:relative; }
  .aclist { position:absolute; left:0; right:0; top:100%; z-index:20; background:#fff; border:1px solid var(--line); border-radius:10px; margin-top:3px; box-shadow:0 6px 20px rgba(0,0,0,.12); overflow:hidden; }
  .aclist div { padding:10px 12px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .aclist div:last-child { border-bottom:0; } .aclist div:hover, .aclist div.on { background:#f4f1ea; }
  .price { background:#0f2633; color:#fff; border-radius:14px; padding:16px; text-align:center; margin-bottom:14px; }
  .price .big { font-size:30px; font-weight:700; } .price .lbl { font-size:13px; opacity:.85; }
  .price .det { font-size:12px; opacity:.8; margin-top:6px; }
  button.go { width:100%; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:12px; background:var(--acc); color:#fff; cursor:pointer; }
  button.go:disabled { opacity:.5; }
  .note { font-size:12px; color:var(--mut); margin-top:10px; text-align:center; }
  .msg { padding:12px; border-radius:10px; font-size:14px; margin:8px 0; }
  .msg.warn { background:#fff6e5; color:#7a5200; } .msg.err { background:#fdeaea; color:#9b1c1c; } .msg.ok { background:#e8f6ee; color:var(--ok); }
  .done { text-align:center; padding:24px 10px; }
  .done .chk { font-size:44px; } .done .ref { font-weight:700; font-size:18px; margin:8px 0; }
  .spin { color:var(--mut); font-size:13px; }
  .langbar { text-align:right; margin-bottom:8px; } .langbar select { width:auto; padding:6px 10px; font-size:14px; border-radius:8px; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button { flex:1; padding:11px; font-size:15px; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--mut); border-radius:10px; cursor:pointer; }
  .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .ride { background:#f4f1ea; border-radius:10px; padding:10px 12px; margin-bottom:6px; }
  .stars { font-size:34px; letter-spacing:4px; margin:4px 0 2px; } .stars span { color:#d7cfc0; cursor:pointer; } .stars span.on { color:#f0a500; }
  .thumb { max-width:100%; border-radius:10px; margin-top:8px; }
  [dir=rtl] .langbar { text-align:left; } [dir=rtl] input, [dir=rtl] textarea { text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="logo-ludy-sombre.png" alt="Ludy" onerror="this.style.display='none'"></header>
  <div id="app"><div class="card spin">Chargement…</div></div>
  <div class="note"><span id="tagline">Transport privé avec chauffeur</span> · Ludy</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="reserve_i18n.js"></script>
<script src="reserve_calc.js"></script>
<script src="reserve.js"></script>
</body>
</html>
